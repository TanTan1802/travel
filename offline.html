<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#135059">
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/png">
    <title>Mất kết nối – Việt Travel</title>
    <style>
        :root { --first: hsl(190, 64%, 22%); --text: hsl(190, 24%, 35%); --bg: hsl(190, 100%, 99%); }
        @media (prefers-color-scheme: dark) { :root { --text: hsl(190, 8%, 75%); --bg: hsl(190, 29%, 12%); } }
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
            font-family: 'Open Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); text-align: center;
        }
        img { width: 96px; height: 96px; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; margin-bottom: .75rem; color: inherit; }
        p { max-width: 420px; margin: 0 auto 1.5rem; line-height: 1.6; }
        .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
        a, button {
            display: inline-block; padding: .9rem 1.6rem; border: none; border-radius: .5rem; cursor: pointer;
            background: var(--first); color: #fff; font: inherit; font-weight: 600; text-decoration: none;
        }
        .ghost { background: transparent; color: inherit; border: 2px solid currentColor; }
    </style>
</head>
<body>
    <main>
        <img src="assets/img/icons/icon-192.png" alt="">
        <h1>Bạn đang offline</h1>
        <p>Trang này chưa được lưu để xem khi mất mạng. Những trang bạn đã mở trước đó vẫn xem được bình thường.</p>
        <div class="actions">
            <button type="button" onclick="location.reload()">Thử lại</button>
            <a href="index.html" class="ghost">Về trang chủ</a>
        </div>
    </main>
</body>
</html>
