# Kiểm tra tự động cho mỗi pull request và mỗi lần đẩy lên main:
# dữ liệu hợp lệ, trang tĩnh đã build mới nhất, và giao diện chạy đúng trên Chromium.
name: Kiểm tra

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci --no-audit --no-fund

      # Lưu Chromium của Playwright giữa các lần chạy (khóa theo package-lock.json)
      - name: Cache trình duyệt Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cài trình duyệt Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Cài thư viện hệ thống cho Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Trang tĩnh phải khớp dữ liệu (đã chạy npm run build)
        run: |
          npm run build
          # -I: bỏ qua <lastmod> của sitemap (lấy theo ngày chạy build nên khác ngày là khác)
          git diff --exit-code -I '<lastmod>' -- diem-den assets/js/data ke-hoach cam-nang en index.html sitemap.xml robots.txt sw.js \
            || (echo "::error::Trang tĩnh chưa được build lại – chạy npm run build rồi commit." && exit 1)

      - name: Test dữ liệu
        run: npm run test:data

      - name: Test giao diện (Playwright)
        run: npm run test:e2e
