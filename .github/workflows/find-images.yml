# Tìm ảnh Wikimedia Commons (giấy phép tự do, ≥ 1200px) cho điểm đến / món ăn mới.
# Tab Actions → "Tìm ảnh Wikimedia" → Run workflow → nhập từ khóa ngăn cách bằng "|". Kết quả ở Summary của lần chạy.
# Chọn "Ảnh xem trước" để có thêm tấm ghép ảnh ứng viên (đánh số khớp bảng) trên nhánh image-previews.
name: Tìm ảnh Wikimedia

on:
  workflow_dispatch:
    inputs:
      queries:
        description: 'Từ khóa, ngăn cách bằng | (vd: Mai Chau|Com lam)'
        required: true
      preview:
        description: 'Ảnh xem trước (đẩy lên nhánh image-previews)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Cài thư viện (ghép ảnh xem trước)
        if: inputs.preview
        run: npm ci --no-audit --no-fund
      - name: Tìm ảnh
        env:
          QUERIES: ${{ inputs.queries }}
          PREVIEW_DIR: ${{ inputs.preview && 'image-previews' || '' }}
        run: node tools/find-images.js
      - name: Đẩy ảnh xem trước lên nhánh image-previews
        if: inputs.preview
        run: |
          cd image-previews
          git init -q -b image-previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Ảnh xem trước: ${QUERIES:0:200}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" image-previews
        env:
          QUERIES: ${{ inputs.queries }}
